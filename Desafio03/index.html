<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Painel Interativo de Usuários</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="header">
    <div class="header-titulo">
      <h1>Painel de Usuários</h1>
      <p>Gerenciamento e Cadastro</p>
    </div>

    <div class="header-stats">
      <div class="stat-card">
        <span class="stat-label">Total Cadastrados:</span>
        <span id="stat-total" class="stat-value">0</span>
      </div>
      <div class="stat-card">
        <span class="stat-label">Média de Idade:</span>
        <span id="stat-media" class="stat-value">0 yrs</span>
      </div>
    </div>
  </header>

  <main class="container">
    
    <section class="card">
      <h2>Cadastrar Usuário</h2>
      <form id="form-usuario">
        <div class="form-group">
          <label for="nome">Nome:</label>
          <input type="text" id="nome" required placeholder="Digite o nome">
        </div>
        
        <div class="form-group">
          <label for="idade">Idade:</label>
          <input type="number" id="idade" required placeholder="Digite a idade">
        </div>

        <div class="form-group">
          <label for="email">E-mail:</label>
          <input type="email" id="email" required placeholder="Digite o e-mail">
        </div>

        <button type="submit" id="btn-cadastrar" class="btn btn-primary">Cadastrar</button>
      </form>

      <div id="mensagem-validacao" class="mensagem"></div>
    </section>

    <section class="card">
      <h2>Lista de Usuários</h2>

      <div class="controles">
        <input type="text" id="busca" placeholder="Buscar por nome..." class="input-busca">
        <div class="botoes-acoes">
          <button id="btn-ordenar" class="btn btn-secondary">Ordenar por nome</button>
          <button id="btn-remover" class="btn btn-danger">Remover último</button>
        </div>
      </div>

      <div id="lista-usuarios" class="grid-usuarios">
      </div>
    </section>

  </main>

  <script src="script.js"></script>
</body>
</html>
